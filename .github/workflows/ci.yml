name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit-self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python scripts
        run: python -m py_compile scripts/repo_audit.py scripts/benchmark_github.py scripts/render_social_card.py

      - name: Run launch audit self-test
        run: python scripts/repo_audit.py . --pretty
